# Default Application Configuration
# Profile-specific configs will override these settings

# Server Configuration
server.port=8080

# Database Configuration (Default to MySQL on localhost)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_school_pro?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Nikunj475@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# use 'update' to auto-update schema, 'create-drop' for testing, 'validate' for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway Configuration
spring.flyway.enabled=false

# JWT Configuration
app.jwt.secret=DefaultSecretKeyChangeInProduction
app.jwt.expiration-ms=2592000000

# Mail Configuration (Gmail SMTP example - with fallback values)
# Change these values based on your email provider
# If MAIL_USERNAME and MAIL_PASSWORD environment variables are not set,
# fallback values will be used automatically
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=khatushatechworks@gmail.com
spring.mail.password=ydimxtdhizvzpllv
spring.mail.default-encoding=UTF-8

# SMTP Properties for Gmail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.test-connection=false

# Optional: Additional mail properties
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.com.smartschool=INFO

# Disable banner
spring.banner.location=classpath:banner.txt

